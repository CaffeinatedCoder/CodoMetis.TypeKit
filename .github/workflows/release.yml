# Publish to NuGet when a v* tag is pushed.
#
# Directory.Build.props is the single source of truth for the version. The tag is checked against
# it rather than driving it, so a mistyped tag fails before anything is pushed. All five packages
# share that version and release together. They are discovered from the pack output, so a future
# package is picked up without editing this file.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Publishing uses Trusted Publishing (OIDC): no long-lived API key exists in this repository.
# GitHub signs a short-lived token proving which workflow in which repository is running, nuget.org
# validates it against a policy configured there, and issues an API key valid for one hour. A
# compromise of this repository's secrets yields nothing that can publish.
#
# Three jobs on purpose: everything that can fail runs unattended, only the push waits behind the
# environment's approval gate, and the GitHub release is created afterwards. A reviewer is asked
# once the full suite has already passed, and no OIDC token is minted until they approve. The job
# that can mint a token cannot write to the repository, and the job that can write to the repository
# cannot mint a token.
#
# Actions are pinned to commit SHAs, not tags: this is the publish path, and NuGet/login runs in the
# one job that can mint a token. The trailing `# vX.Y.Z` is what Dependabot reads; keep it by the SHA.
#
# Setup, once:
#   1. GitHub → Settings → Environments → create `nuget`, and add yourself under "Required
#      reviewers" (without a reviewer the environment adds no gate).
#   2. nuget.org → your account → Trusted Publishing → add a policy naming this repository's owner,
#      this repository, the workflow *file name* (release.yml, not a path) and the environment
#      `nuget`. The environment must match: the OIDC token carries it as a claim, and a policy that
#      does not expect it will not match.
#   3. Add a NUGET_USER secret holding your nuget.org *profile name*, not the email address. It is
#      not a credential; it is a secret only to keep it out of build logs.
#
# The file name, the environment and the job split are pinned by ReleaseWiringTests: renaming either
# name makes the next tag fail with an authentication error that says nothing about the rename.
#
# Every job runs without a Metalama license, as CI does; the packages need none to build.

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and pack, but do not push to NuGet"
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest

    permissions:
      contents: read   # deliberately nothing more: this job runs unattended and must not mint a token

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # MSBuild evaluation rather than parsing the XML, so the value is exactly what the build will
      # stamp onto the packages.
      - name: Resolve version
        id: version
        run: |
          version="$(dotnet msbuild src/CodoMetis.TypeKit/CodoMetis.TypeKit.csproj -getProperty:Version | tr -d '[:space:]')"
          if [[ -z "$version" ]]; then
            echo "::error::Could not evaluate the Version property."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="${{ steps.version.outputs.version }}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match Directory.Build.props ($version). Bump the version and re-tag rather than publishing a version nothing documents."
            exit 1
          fi

      # The changelog section is the GitHub release's notes, and its heading says whether the release
      # was prepared. A tag on a version still marked Unreleased was pushed too early.
      - name: Verify the changelog dates this version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          heading="$(grep -E "^## ${VERSION//./\\.}( |$)" CHANGELOG.md | head -1)"
          if [[ -z "$heading" ]]; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section."
            exit 1
          fi
          if [[ "$heading" == *Unreleased* ]]; then
            echo "::error::CHANGELOG.md still reads '$heading'. Date the section (CONTRIBUTING.md, Releasing) and re-tag."
            exit 1
          fi

      - name: Build
        run: dotnet build CodoMetis.TypeKit.slnx -c Release

      # The full suite gates the release, the conventions project included: it holds the analyzer
      # release tracking to the changelog, and this workflow to the names above.
      - name: Test
        run: dotnet test --solution CodoMetis.TypeKit.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack CodoMetis.TypeKit.slnx -c Release --no-build -o dist

      # The smoke test publishes a consumer with Native AOT, which links with the platform's clang
      # and zlib (docs/plan.md §11).
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Installs the packages just packed into throwaway projects outside this repository and runs
      # real code against them. Passing dist means the artifacts published are the artifacts tested,
      # rather than a fresh pack that happens to be built from the same commit.
      - name: Consumer smoke test
        run: ./test/consumer-smoke-test.sh dist

      # One CycloneDX SBOM per package, describing what a consumer actually takes on.
      #
      # --exclude-filter drops the build-only references and their subtrees, which no consumer
      # receives and no nuspec names: the analyzer's Roslyn references (PrivateAssets=all; the
      # analyzer runs inside the consumer's own compiler), and what the SDK adds on its own, the
      # ILLink tasks every IsAotCompatible project gets and NETStandard.Library under the
      # netstandard2.0 analyzer. Listing them would contradict the nuspec and hand consumers
      # vulnerability alerts for code they do not ship. ReleaseWiringTests reads restore output and
      # asserts the filter covers every reference it marks build-only (suppressParent All).
      #
      # --include-project-references keeps the base package listed as a dependency of the others,
      # matching their nuspecs.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          for directory in src/*/; do
            id="$(basename "$directory")"
            echo "==> $id"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist \
              --filename "$id.${{ steps.version.outputs.version }}.cdx.json" \
              --output-format Json \
              --set-type Library \
              --set-nuget-purl \
              --set-name "$id" \
              --set-version "${{ steps.version.outputs.version }}" \
              --include-project-references \
              --exclude-filter Microsoft.CodeAnalysis.CSharp,Microsoft.CodeAnalysis.Analyzers,Microsoft.NET.ILLink.Tasks,NETStandard.Library
          done

      - name: Collect packages
        run: |
          shopt -s nullglob
          packages=(dist/*."${{ steps.version.outputs.version }}".nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::No *.${{ steps.version.outputs.version }}.nupkg found in dist/."
            exit 1
          fi
          printf 'Packages (%d):\n' "${#packages[@]}"
          printf '    %s\n' "${packages[@]##*/}"

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify

    # Skipped entirely on a dry run, so no approval is requested and no token is minted.
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}

    # The approval gate. Must match the environment named in the nuget.org policy.
    environment: nuget

    permissions:
      contents: read
      id-token: write   # lets GitHub mint the OIDC token nuget.org validates

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      # Publishes exactly what was verified: the packages are not rebuilt here.
      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Verify the publisher identity is configured
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [[ -z "${NUGET_USER:-}" ]]; then
            echo "::error::NUGET_USER secret is not set. It must be your nuget.org profile name, not the email address."
            exit 1
          fi

      # Exchanges this run's OIDC token for an API key that nuget.org issues against the trusted
      # publishing policy, valid for one hour. The token is single-use and nothing is stored.
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # The packages, without their symbols: those are the next step's. --skip-duplicate makes a
      # re-run after a partial failure safe, but a .nupkg nuget.org already has is skipped together
      # with its .snupkg, so symbols pushed alongside would never be retried: a re-run would go
      # green with a failed symbol upload still missing.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
            echo "==> Pushing $(basename "$package")"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --no-symbols \
              --skip-duplicate
          done

      # Each .snupkg on its own, after every package it belongs to: nuget.org refuses symbols for a
      # package it does not have. It accepts the same symbol package more than once and answers 409
      # while one is still being validated, which --skip-duplicate skips, so a re-run completes
      # whatever is missing. --symbol-source names the feed whose symbol endpoint to use: without
      # it, a .snupkg for which NuGet resolves no symbol endpoint is skipped without an error. The
      # analyzer package has no .snupkg by design (it packs no lib/), but none at all means the
      # library packages were packed without symbols.
      - name: Push symbols to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          shopt -s nullglob
          symbols=(dist/*."$VERSION".snupkg)
          if [[ ${#symbols[@]} -eq 0 ]]; then
            echo "::error::No *.$VERSION.snupkg in dist/: the library packages were packed without symbols."
            exit 1
          fi
          for symbol in "${symbols[@]}"; do
            echo "==> Pushing $(basename "$symbol")"
            dotnet nuget push "$symbol" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --symbol-source "$NUGET_SOURCE" \
              --skip-duplicate
          done

      - name: Summary
        run: |
          {
            echo "### Released ${{ needs.verify.outputs.version }}"
            echo
            for package in dist/*."${{ needs.verify.outputs.version }}".nupkg; do
              echo "- \`$(basename "$package")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Gives the SBOMs a permanent home: workflow artifacts expire after 90 days, and nuget.org has no
  # slot for an SBOM. Runs after the push, so what is attached describes what is on nuget.org. Only
  # the SBOMs are attached: nuget.org repository-signs every package on ingestion, so a .nupkg from
  # there differs byte for byte from the one built here, and attaching ours would invite a hash
  # comparison that fails for a benign reason.
  #
  # Separate from `publish` on purpose: that job holds id-token: write, this one contents: write, and
  # no job holds both.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [ verify, publish ]

    # Tag pushes only. A manual non-dry run from a branch has no tag to release against.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write   # create the release and upload assets; nothing else

    steps:
      # The checkout is for CHANGELOG.md, the source of the release notes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Download packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: nupkg-${{ needs.verify.outputs.version }}
          path: dist

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="$GITHUB_REF_NAME"

          # "Not found" is the one failure that means "create it"; anything else (auth, API) must
          # not be mistaken for it.
          if gh release view "$tag" --json tagName >/dev/null 2>view.err; then
            echo "Release $tag already exists; leaving its notes as written."
            exit 0
          elif ! grep -q "release not found" view.err; then
            cat view.err
            echo "::error::Could not determine whether release $tag exists."
            exit 1
          fi

          # The section for this version, from the line after its heading up to, not including, the
          # next H2. The heading itself is left out: the release's title already names the version.
          # awk exits 1 only when there is no such heading.
          if ! notes="$(awk -v version="$VERSION" '
            index($0, "## " version " ") == 1 || $0 == "## " version { found = 1; next }
            found && /^## / { exit }
            found && (started || NF) { started = 1; print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md)"; then
            echo "::error::CHANGELOG.md has no '## $VERSION' section to use as release notes."
            exit 1
          fi

          {
            printf '%s\n\n' "$notes"
            printf 'Published to nuget.org through Trusted Publishing by [this run](%s). ' "$RUN_URL"
            printf 'The CycloneDX SBOM for each package is attached below.\n'
          } > release-notes.md

          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$tag" --verify-tag --title "$tag" --notes-file release-notes.md "${flags[@]}"

      - name: Attach the SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          shopt -s nullglob
          sboms=(dist/*."$VERSION".cdx.json)
          if [[ ${#sboms[@]} -eq 0 ]]; then
            echo "::error::No *.$VERSION.cdx.json in the downloaded artifact: the SBOM step in verify did not run, or the artifact glob changed."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${sboms[@]}" --clobber --repo "${{ github.repository }}"
