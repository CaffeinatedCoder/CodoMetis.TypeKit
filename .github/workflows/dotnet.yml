# Build, test and pack on every push to main or a release branch and every PR into one, in lanes: the Linux
# test leg always, the Windows leg and the pack (Pack and Consumer) when the change can affect them, and the
# macOS leg only in a run that selects nothing.
# tools/CiLanes selects them from the changed paths in the changes job, and the CI job judges the run: every
# selected job passed and every other was skipped (design/adr/0113-ci-runs-the-lanes-a-change-can-affect.md).
# A PR into main, a push to main, a dispatch, the nightly run (nightly.yml) and the release (release.yml calls
# this workflow) run every lane. Topics merge into release/<version> and the release branch into main
# (design/adr/0094-topic-branches-into-a-release-branch-and-fix-trailers.md).
#
# The tests run on Linux, Windows and macOS: a contributor needs git and the pinned SDK on any of
# them (design/adr/0092-repository-tooling-is-dotnet-and-ci-needs-no-ai.md), and the second and third
# runners test the repository's own assumptions (paths, line endings, child processes, the tooling)
# rather than the .NET runtime. Packing, the smoke test and the SBOMs stay on Linux.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved to a different commit (the
# tj-actions/changed-files compromise, March 2025), a SHA cannot. The trailing `# vX.Y.Z` is what
# Dependabot reads to propose updates, so keep it next to the SHA.
#
# The SDK comes from global.json, not from a version typed here, so CI builds with exactly the
# band the repository pins.
#
# Every job runs with no Metalama license on the machine, so a green run is the standing evidence
# that consumers need none either. It was first measured in a clean container on 2026-09-27
# (spikes/FabricSpike, finding 9): the whole solution builds and the woven probes pass.

name: .NET

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:
  # release.yml runs every lane before it verifies. Its event is the tag's push, which selects every lane.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR makes the in-flight run pointless; main is never cancelled. The prefix keeps a call from
# release.yml out of its caller's group: a called workflow's github.workflow is the caller's name, and groups
# ignore case, so without it both would be release-<tag> and the call would wait for its caller (KB-043).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Which lanes this run needs, from the paths it changes (tools/CiLanes, design/adr/0113): a PR into a release
  # branch against its base, a push to one against the commit it replaced, every other run every lane. The job
  # summary lists each path's class. A diff that fails fails this job, and the CI job with it, never skips a lane.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.select.outputs.legs }}
      pack: ${{ steps.select.outputs.pack }}
      suite: ${{ steps.select.outputs.suite }}

    steps:
      # The whole history: the diff is against the base branch, which a shallow clone has not fetched.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # A tool project, run as its built dll (design/adr/0092).
      - name: Build the selection
        run: dotnet build tools/CiLanes -c Release

      - name: Select the lanes
        id: select
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: >
          dotnet tools/CiLanes/bin/Release/net10.0/ci-lanes.dll select
          --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --base "$BASE_REF" --before "$BEFORE"
          --output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  # The legs the changes job selected: Linux in every run, Windows when the change can affect it, macOS only in a
  # run that selects nothing. A prose-only change builds and runs test/Prose.slnf alone, the test projects that
  # read prose (ProseReaderTests holds the set); anything else, the whole solution.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    env:
      SOLUTION: ${{ needs.changes.outputs.suite == 'prose' && 'test/Prose.slnf' || 'CodoMetis.TypeKit.slnx' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.legs) }}

    steps:
      # The whole history and its tags: CommitTrailerTests reads the fix commits since v2.1.0, and
      # refuses a shallow clone rather than pass on one (design/adr/0094).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore

      # The EF Core round trips start a PostgreSQL container. Ubuntu runners have Docker; macOS
      # runners have none and Windows runners run only Windows containers, so those legs leave the
      # one class that needs it out.
      - name: Test
        run: >
          dotnet test --solution "$SOLUTION" -c Release --no-build
          --report-xunit-trx --results-directory TestResults
          ${{ runner.os != 'Linux' && '--filter-not-class "*PostgreSqlRoundTripTests"' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  # The pack catches a package that names a README it does not pack and a broken SBOM step, and the two
  # smoke tests a consumer that no longer restores, compiles or publishes with Native AOT against the
  # packed feed and against one packed on the spot. Both run when the changes job selects the pack lane,
  # beside the test legs rather than after them: neither reads the tests' outcome, and the CI job requires
  # all of them. The release (release.yml) runs them again on what it publishes.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: needs.changes.outputs.pack == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Packing is itself a check: a package that names a README it does not pack fails here.
      - name: Build
        run: dotnet build CodoMetis.TypeKit.slnx -c Release

      - name: Pack
        run: dotnet pack CodoMetis.TypeKit.slnx -c Release --no-build -o dist

      # The smoke test publishes a consumer with Native AOT, which links with the platform's clang
      # and zlib (design/native-aot.md).
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Against the packed feed, exactly as the release workflow runs it. The `consumer` job runs the
      # other mode, packing its own feed. The two are not interchangeable: packing fills the private
      # package cache with the solution's dependencies, and a restore that only works because of that
      # passes one way and fails the other, which broke a release in a sibling repository.
      - name: Consumer smoke test against the packed feed
        run: dotnet tools/ConsumerSmokeTest/bin/Release/net10.0/consumer-smoke-test.dll dist

      # Here as well as in the release, so a broken SBOM step surfaces on a PR rather than on release
      # day. The flags are the release workflow's; ReleaseWiringTests keeps the exclusions in step.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          version="$(dotnet msbuild src/CodoMetis.TypeKit/CodoMetis.TypeKit.csproj -getProperty:Version)"
          for directory in src/*/; do
            id="$(basename "$directory")"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist --filename "$id.$version.cdx.json" --output-format Json \
              --set-type Library --set-nuget-purl --set-name "$id" --set-version "$version" \
              --include-project-references \
              --exclude-filter Microsoft.CodeAnalysis.CSharp,Microsoft.CodeAnalysis.Analyzers,Microsoft.NET.ILLink.Tasks,NETStandard.Library
          done

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  consumer:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    needs: [ changes ]
    if: needs.changes.outputs.pack == 'true'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # The smoke test publishes a consumer with Native AOT, which links with the platform's clang
      # and zlib (design/native-aot.md).
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # The smoke test is a tool project, run as its built dll (design/adr/0092).
      - name: Build the consumer smoke test
        run: dotnet build tools/ConsumerSmokeTest -c Release

      - name: Consumer smoke test, packing its own feed
        run: dotnet tools/ConsumerSmokeTest/bin/Release/net10.0/consumer-smoke-test.dll

  # The one required build check: every job the changes job selected succeeded and every other was skipped
  # (tools/CiLanes gate, design/adr/0113). A skipped job reads as a passing required check, so the legs
  # themselves cannot be required once they may be skipped (KB-043). Under always(), so a failed selection or a
  # cancelled leg fails this job rather than skipping it, and a skipped CI is never what a merge sees.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ changes, test, pack, consumer ]
    if: always()

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build the gate
        run: dotnet build tools/CiLanes -c Release

      - name: Every selected job passed, every other was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          dotnet tools/CiLanes/bin/Release/net10.0/ci-lanes.dll gate "$RUNNER_TEMP/needs.json" --summary "$GITHUB_STEP_SUMMARY"
