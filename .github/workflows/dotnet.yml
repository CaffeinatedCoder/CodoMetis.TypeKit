# Build and test on every push to main and every PR.
#
# Linux only, as in the sibling repositories: the shipping code is pure managed code on a single
# TFM, and a second runner would re-test the .NET runtime rather than this library.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved to a different commit (the
# tj-actions/changed-files compromise, March 2025), a SHA cannot. The trailing `# vX.Y.Z` is what
# Dependabot reads to propose updates, so keep it next to the SHA.
#
# The SDK comes from global.json, not from a version typed here, so CI builds with exactly the
# band the repository pins.
#
# This job also runs with no Metalama license on the machine. Once the aspects land (phase 3),
# a green run is the evidence that consumers need none either (docs/plan.md §5).

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR makes the in-flight run pointless; main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodoMetis.TypeKit.slnx

      - name: Build
        run: dotnet build CodoMetis.TypeKit.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test --solution CodoMetis.TypeKit.slnx -c Release --no-build
          --report-xunit-trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
