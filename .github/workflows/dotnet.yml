# Build, test and pack on every push to main or a release branch and every PR into one. Topics
# merge into release/<version> and the release branch into main
# (design/adr/0094-topic-branches-into-a-release-branch-and-fix-trailers.md).
#
# The tests run on Linux, Windows and macOS: a contributor needs git and the pinned SDK on any of
# them (design/adr/0092-repository-tooling-is-dotnet-and-ci-needs-no-ai.md), and the second and third
# runners test the repository's own assumptions (paths, line endings, child processes, the tooling)
# rather than the .NET runtime. Packing, the smoke test and the SBOMs stay on Linux.
#
# Actions are pinned to commit SHAs, not tags: a tag can be moved to a different commit (the
# tj-actions/changed-files compromise, March 2025), a SHA cannot. The trailing `# vX.Y.Z` is what
# Dependabot reads to propose updates, so keep it next to the SHA.
#
# The SDK comes from global.json, not from a version typed here, so CI builds with exactly the
# band the repository pins.
#
# Every job runs with no Metalama license on the machine, so a green run is the standing evidence
# that consumers need none either. It was first measured in a clean container on 2026-09-27
# (spikes/FabricSpike, finding 9): the whole solution builds and the woven probes pass.

name: .NET

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# A new push to a PR makes the in-flight run pointless; main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      # The whole history and its tags: CommitTrailerTests reads the fix commits since v2.1.0, and
      # refuses a shallow clone rather than pass on one (design/adr/0094).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodoMetis.TypeKit.slnx

      - name: Build
        run: dotnet build CodoMetis.TypeKit.slnx -c Release --no-restore

      # The EF Core round trips start a PostgreSQL container. Ubuntu runners have Docker; macOS
      # runners have none and Windows runners run only Windows containers, so those legs leave the
      # one class that needs it out.
      - name: Test
        run: >
          dotnet test --solution CodoMetis.TypeKit.slnx -c Release --no-build
          --report-xunit-trx --results-directory TestResults
          ${{ runner.os != 'Linux' && '--filter-not-class "*PostgreSqlRoundTripTests"' || '' }}

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore

  # The probe corpus (tools/probe/corpus), replayed with no model: every probe, from an empty state
  # directory, so a probe that fails fails the job (design/adr/0095). Linux only: the probes test
  # documented claims, not the platform, and the test job's three legs already test the prober itself.
  probes:
    name: Probe replay
    runs-on: ubuntu-latest

    steps:
      # The whole history: the replay adds a git worktree at HEAD, and `universe` reads the claims
      # against origin/main.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # The prober's state and its replay worktree, in this job's own temporary directory, never a
      # developer's (the default without PROBE_STATE_DIR).
      - name: Prober state directory
        run: |
          echo "PROBE_STATE_DIR=$RUNNER_TEMP/probe-state" >> "$GITHUB_ENV"
          echo "PROBE_CACHE_DIR=$RUNNER_TEMP/probe-cache" >> "$GITHUB_ENV"

      # The prober is a tool project, run as its built dll (design/adr/0092).
      - name: Build the prober
        run: dotnet build tools/Prober -c Release

      - name: Replay every probe
        run: dotnet tools/Prober/bin/Release/net10.0/prober.dll replay --all

      # A report: the documented claims' pair coverage and the open findings, in the job summary. It
      # fails only when the prober cannot read the claims. `universe` builds what `status` reads.
      - name: Probe status
        if: always()
        run: |
          dotnet tools/Prober/bin/Release/net10.0/prober.dll universe > /dev/null
          dotnet tools/Prober/bin/Release/net10.0/prober.dll status | tee status.txt
          { echo '### Probe status'; echo; echo '```text'; cat status.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The evidence of each probe, for triage of a failure.
      - name: Upload the probe state
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: probe-state
          path: ${{ runner.temp }}/probe-state
          if-no-files-found: ignore

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # Packing is itself a check: a package that names a README it does not pack fails here.
      - name: Build
        run: dotnet build CodoMetis.TypeKit.slnx -c Release

      - name: Pack
        run: dotnet pack CodoMetis.TypeKit.slnx -c Release --no-build -o dist

      # The smoke test publishes a consumer with Native AOT, which links with the platform's clang
      # and zlib (design/native-aot.md).
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Against the packed feed, exactly as the release workflow runs it. The `consumer` job runs the
      # other mode, packing its own feed. The two are not interchangeable: packing fills the private
      # package cache with the solution's dependencies, and a restore that only works because of that
      # passes one way and fails the other, which broke a release in a sibling repository.
      - name: Consumer smoke test against the packed feed
        run: dotnet tools/ConsumerSmokeTest/bin/Release/net10.0/consumer-smoke-test.dll dist

      # Here as well as in the release, so a broken SBOM step surfaces on a PR rather than on release
      # day. The flags are the release workflow's; ReleaseWiringTests keeps the exclusions in step.
      - name: Generate SBOMs
        run: |
          dotnet tool restore
          version="$(dotnet msbuild src/CodoMetis.TypeKit/CodoMetis.TypeKit.csproj -getProperty:Version)"
          for directory in src/*/; do
            id="$(basename "$directory")"
            dotnet cyclonedx "$directory$id.csproj" \
              --output dist --filename "$id.$version.cdx.json" --output-format Json \
              --set-type Library --set-nuget-purl --set-name "$id" --set-version "$version" \
              --include-project-references \
              --exclude-filter Microsoft.CodeAnalysis.CSharp,Microsoft.CodeAnalysis.Analyzers,Microsoft.NET.ILLink.Tasks,NETStandard.Library
          done

      - name: Upload packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: nupkg
          path: |
            dist/*.nupkg
            dist/*.snupkg
            dist/*.cdx.json

  consumer:
    name: Consumer smoke test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      # The smoke test publishes a consumer with Native AOT, which links with the platform's clang
      # and zlib (design/native-aot.md).
      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # The smoke test is a tool project, run as its built dll (design/adr/0092).
      - name: Build the consumer smoke test
        run: dotnet build tools/ConsumerSmokeTest -c Release

      - name: Consumer smoke test, packing its own feed
        run: dotnet tools/ConsumerSmokeTest/bin/Release/net10.0/consumer-smoke-test.dll
