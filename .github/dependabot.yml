# Two ecosystems, on purpose narrow (same policy as CodoMetis.ValueRanges).
#
# github-actions keeps the SHA-pinned actions current: weekly, one grouped PR, majors excluded,
# because a major on the publish path is a deliberate change with a test behind it.
#
# nuget covers the test projects only. The shipping projects' references (Metalama, EF Core,
# Microsoft.AspNetCore.OpenApi, the analyzer's Roslyn floor) are floors every consumer restores
# against, so raising one is a release decision, not a dependency update. Security advisories
# still surface for everything through Dependabot security updates and NuGetAudit at build time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]

  - package-ecosystem: nuget
    directories:
      - /test/*
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns: [ "*" ]
    ignore:
      - dependency-name: "Metalama*"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
      - dependency-name: "Microsoft.AspNetCore*"
      - dependency-name: "Microsoft.CodeAnalysis*"
